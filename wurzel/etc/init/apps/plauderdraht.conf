description "STARTTLS-Draht fuer das XMPP-Konto"
author "Sebastian"
start on EXT_APPS_STARTED
stop on stopping xsession
console none
respawn
respawn limit 20 120
# Mit "console none" und ohne Umleitung geht jede Meldung ins Leere --
# und wenn der Draht sein Konto nicht findet, steht das nirgends.
exec /opt/plauderdraht/plauderdraht >> /var/log/plauderdraht.log 2>&1
